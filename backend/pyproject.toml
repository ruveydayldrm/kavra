[project]
name = "kavra"
version = "0.1.0"
description = "Turn your course notes into a source-grounded personal exam coach."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "youtube-transcript-api>=1.2",
  "fsrs>=6.0",
  "rapidfuzz>=3.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.2"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
kavra = "kavra.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
packages = ["kavra"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
